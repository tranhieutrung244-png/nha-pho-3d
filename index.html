<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10151c">
<title>Nhà phố 3D – Gia đình David</title>
<style>
:root{color-scheme:dark;--panel:rgba(16,22,30,.88);--line:rgba(255,255,255,.14);--txt:#f4f6f8;--muted:#aab4c0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111820;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand,.hint{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px;backdrop-filter:blur(12px);box-shadow:0 5px 22px #0005}
.brand b{display:block;font-size:13px;letter-spacing:.3px}.brand small{color:var(--muted);font-size:10px}
.hint{font-size:11px;color:#d8e0e8;max-width:48%;line-height:1.35;text-align:right}
.toolbar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;pointer-events:none}
button{pointer-events:auto;border:1px solid var(--line);background:var(--panel);color:var(--txt);padding:11px 14px;border-radius:13px;font-weight:650;font-size:12px;backdrop-filter:blur(12px);box-shadow:0 5px 18px #0005;min-height:42px}
button:active{transform:scale(.96)}button.red{background:#a92f37;border-color:#e45b63}button.active{background:#1d705f;border-color:#49b79e}
#status{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 70px);padding:8px 11px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:11px;color:#dce5ed;max-width:65%;pointer-events:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#10151c;z-index:5;font-size:14px;color:#e8edf2}
@media(prefers-color-scheme:light){:root{color-scheme:light}#loading{background:#e9edf1;color:#202830}.brand,.hint,button,#status{background:rgba(255,255,255,.88);color:#17202a;border-color:#0002}}
</style>
</head>
<body>
<div id="view"></div><div id="loading">Đang dựng ngôi nhà 3D…</div>
<div class="top"><div class="brand"><b>NHÀ PHỐ 3D</b><small>5,5 × 12 m · Gia đình 4 người</small></div><div class="hint">Vuốt: xoay nhà · Chụm: thu phóng<br>Chạm người để chọn · Chạm sàn để di chuyển<br>Giữ/kéo để nhấc · Thả nhanh để ném</div></div>
<div id="status">Đang chọn: <b>David</b></div>
<div class="toolbar">
<button class="red" id="reset">↺ Reset</button><button id="roof" class="active">⌂ Mái nhà: Bật</button><button id="gravity">↓ Trọng lực thấp: Tắt</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(()=> {
'use strict';
const mount=document.getElementById('view'), status=document.getElementById('status'), loading=document.getElementById('loading');
if(!window.THREE||!window.CANNON){loading.textContent='Không tải được thư viện 3D. Hãy kiểm tra kết nối Internet rồi tải lại.';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb9c3cc);scene.fog=new THREE.Fog(0xb9c3cc,24,48);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(13,13,16);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.65));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x78816f,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.25);sun.position.set(-7,15,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-15;sun.shadow.camera.right=15;sun.shadow.camera.top=15;sun.shadow.camera.bottom=-15;scene.add(sun);
const world=new CANNON.World();world.gravity.set(0,-9.82,0);world.broadphase=new CANNON.NaiveBroadphase();world.solver.iterations=8;world.defaultContactMaterial.friction=.55;world.defaultContactMaterial.restitution=.12;
const mat=(color,rough=.8,metal=0,transparent=false,opacity=1)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,transparent,opacity,depthWrite:!transparent});
const M={wall:mat(0xe8e4dc,.9,0,true,.28),floor:mat(0xd6d0c5),wood:mat(0x9a7655),darkwood:mat(0x594536),white:mat(0xf3f0e8),glass:mat(0x9ed8e5,.15,.1,true,.38),fabric:mat(0xb9b0a3),green:mat(0x4d8051),leaf:mat(0x3c8750),black:mat(0x252b30),metal:mat(0x777f85,.35,.65),tile:mat(0xc8c8c1),blue:mat(0x6f8793),pink:mat(0xd995a5),skin:mat(0xe6b995),hair:mat(0x382b25),red:mat(0x9c4141)};
const boxGeo=new THREE.BoxGeometry(1,1,1);
function cube(parent,name,x,y,z,sx,sy,sz,material,cast=true){const o=new THREE.Mesh(boxGeo,material);o.name=name;o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=cast;o.receiveShadow=true;parent.add(o);return o}
function cyl(parent,x,y,z,r1,r2,h,material){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12),material);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
const house=new THREE.Group();scene.add(house);
const ground=cube(house,'Nền khu đất',0,-.22,0,7.1,.35,13.6,mat(0xb6b6ad)); 
// floors
cube(house,'Sàn tầng 1',0,.02,0,5.5,.16,12,M.floor);
cube(house,'Sàn tầng 2',0,3.22,0,5.5,.16,12,M.floor);
// translucent outer walls, intentionally cutaway at front-right for viewing
cube(house,'Tường trái tầng 1',-2.72,1.55,0,.12,3.1,12,M.wall);
cube(house,'Tường phải tầng 1',2.72,1.55,-1.25,.12,3.1,9.5,M.wall);
cube(house,'Tường sau tầng 1',0,1.55,-5.95,5.5,3.1,.12,M.wall);
cube(house,'Tường trước tầng 1',-1.7,1.55,5.95,2.1,3.1,.12,M.wall);
cube(house,'Tường trái tầng 2',-2.72,4.72,0,.12,3,12,M.wall);
cube(house,'Tường phải tầng 2',2.72,4.72,-1.5,.12,3,9,M.wall);
cube(house,'Tường sau tầng 2',0,4.72,-5.95,5.5,3,.12,M.wall);
cube(house,'Tường trước tầng 2',-1.75,4.72,5.95,2,3,.12,M.wall);
// partitions
cube(house,'Vách gara',-1.35,1.5,3.05,.10,3,.12,M.wood);
cube(house,'Vách bếp',1.55,1.5,-2.15,.10,3,3.5,M.wall);
cube(house,'Vách phòng ngủ sau',0,4.7,-3.1,5.4,2.9,.10,M.wall);
cube(house,'Vách phòng thờ',0,4.7,.1,5.4,2.9,.10,M.wall);
cube(house,'Vách phòng ngủ trước',0,4.7,3.05,5.4,2.9,.10,M.wall);
// roof toggled
const roof=new THREE.Group();house.add(roof);
cube(roof,'Mái',0,6.35,0,5.85,.22,12.3,mat(0x59636b));
for(let z=-4.8;z<=4.8;z+=2.4)cube(roof,'Xà mái',0,6.22,z,5.8,.13,.12,M.darkwood);
// doors/windows facade detail
for(let z=-4.8;z<5;z+=2.4){cube(house,'Khung cửa sổ',-2.64,1.9,z,.05,1.1,1.4,M.metal);cube(house,'Kính cửa sổ',-2.60,1.9,z,.025,.95,1.25,M.glass);}
cube(house,'Cổng gara',0,1.05,6.12,2.7,2.1,.12,M.metal);
// stairs along left wall, from front-ish ground to second floor
const stair=new THREE.Group();house.add(stair);
for(let i=0;i<12;i++){let t=i/11;cube(stair,'Bậc thang',-1.95, .18+t*3.05,2.15-t*4.2,.95,.18,.43,M.wood);}
// stair rail
cube(stair,'Lan can',-2.38,1.75,.0,.07,3.2,.08,M.darkwood);
// label text sprite
function labelSprite(text){const c=document.createElement('canvas');c.width=256;c.height=64;const ctx=c.getContext('2d');ctx.fillStyle='rgba(22,30,38,.78)';ctx.roundRect(8,8,240,48,14);ctx.fill();ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillStyle='white';ctx.fillText(text,128,41);const tx=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthTest:false}));s.scale.set(1.35,.34,1);return s;}
function addPlant(x,z,y=0){const g=new THREE.Group();g.position.set(x,y,z);house.add(g);cyl(g,0,.28,0,.18,.22,.55,mat(0x9b7655));for(let i=0;i<7;i++){const a=i*Math.PI*2/7;const l=cube(g,'Lá cây',Math.cos(a)*.22,.65+Math.random()*.28,Math.sin(a)*.22,.12,.65,.12,M.leaf);l.rotation.z=-Math.cos(a)*.5;l.rotation.x=Math.sin(a)*.5;}return g;}
addPlant(1.95,-5.05);addPlant(-1.9,-5.1);addPlant(.7,-5.15);
// furniture helper
const furniture=[];
function item(name,x,y,z){const g=new THREE.Group();g.name=name;g.position.set(x,y,z);house.add(g);furniture.push(g);return g;}
function makeSofa(x,z){let g=item('Sofa phòng khách',1.45,.12,2.0);cube(g,'Đế sofa',0,.32,0,2,.45,.8,M.fabric);cube(g,'Lưng sofa',0,.78,-.31,2,.65,.18,M.fabric);cube(g,'Tay vịn trái',-.92,.58,.02,.18,.52,.8,M.fabric);cube(g,'Tay vịn phải',.92,.58,.02,.18,.52,.8,M.fabric);for(let x of [-.48,.48])cube(g,'Đệm sofa',x,.57,.1,.88,.16,.57,mat(0xd5cfc4));for(let x of [-.7,.7])cube(g,'Chân sofa',x,.12,.25,.09,.24,.09,M.darkwood);return g;}
makeSofa(0,0);
let g=item('Bàn kính phòng khách',.45,.15,3.15);cube(g,'Mặt kính',0,.45,0,1.15,.08,.68,M.glass);for(let x of [-.48,.48])for(let z of [-.25,.25])cube(g,'Chân bàn',x,.22,z,.06,.45,.06,M.metal);
g=item('Kệ TV',-1.9,.12,1.65);cube(g,'Tủ TV',0,.38,0,.35,.72,1.7,M.wood);cube(g,'Màn hình TV',.23,1.05,0,.09,.95,1.45,M.black);
g=item('Bàn ăn',.6,.12,-1.2);cube(g,'Mặt bàn',0,.82,0,1.7,.12,.9,M.wood);for(let x of [-.72,.72])for(let z of [-.34,.34])cube(g,'Chân bàn ăn',x,.42,z,.08,.8,.08,M.darkwood);
for(let x of [-.65,.65])for(let z of [-.85,.85]){let ch=cube(g,'Ghế ăn',x,.48,z,.48,.12,.45,M.fabric);cube(g,'Tựa ghế',x,.78,z-.18,.48,.58,.10,M.wood);for(let xx of [-.17,.17])for(let zz of [-.15,.15])cube(g,'Chân ghế',x+xx,.22,z+zz,.05,.48,.05,M.darkwood);}
g=item('Tủ bếp',2.1,.1,-3.45);cube(g,'Tủ dưới',0,.5,0,.95,1,.7,M.wood);cube(g,'Mặt đá',0,1.05,0,1.05,.12,.8,M.white);cube(g,'Tủ lạnh',-.05,1.05,-1.0,.85,2.05,.8,M.white);cube(g,'Tay nắm tủ lạnh',.4,1.1,-.58,.04,.6,.05,M.metal);cube(g,'Bếp nấu',.1,1.14,.05,.55,.04,.48,M.black);
g=item('WC tầng 1',1.8,.1,-5.1);cube(g,'Bồn rửa',-.55,.65,0,.55,.18,.45,M.white);cyl(g,-.55,.83,0,.06,.06,.25,M.metal);cube(g,'Bồn cầu',.35,.3,-.05,.48,.55,.65,M.white);cube(g,'Nắp bồn cầu',.35,.58,-.05,.5,.10,.68,M.white);
// garage two motorcycles
function bike(x,z,color){let b=item('Xe máy',x,.15,z);const wheelmat=mat(0x202326,.65);for(let zz of [-.58,.58]){let w=cyl(b,0,.43,zz,.32,.32,.13,wheelmat);w.rotation.x=Math.PI/2;let hub=cyl(b,0,.43,zz,.12,.12,.14,M.metal);hub.rotation.x=Math.PI/2;}cube(b,'Thân xe',0,.78,0,.42,.38,.85,mat(color));cube(b,'Yên xe',0,1.03,-.1,.4,.13,.62,M.black);cube(b,'Đèn xe',0,.85,.48,.25,.17,.08,M.white);cube(b,'Tay lái',0,1.25,.45,.75,.06,.07,M.metal);return b;}
bike(-.75,4.55,0x9e3440);bike(.75,4.55,0x252a2f);
// upstairs bedrooms and altar
function bed(x,z,color){let b=item('Giường ngủ',x,3.32,z);cube(b,'Khung giường',0,.3,0,1.8,.42,2.15,M.wood);cube(b,'Nệm',0,.58,0,1.72,.22,2.05,M.white);cube(b,'Chăn',0,.72,.45,1.68,.12,1.05,mat(color));for(let xx of [-.48,.48])cube(b,'Gối',xx,.78,-.72,.62,.16,.48,M.white);cube(b,'Đầu giường',0,.85,-1.05,1.9,1.1,.12,M.wood);return b;}
bed(0,-4.55,0x9bb1bf);bed(0,4.45,0xb9a1a1);
g=item('Bàn thờ',0,3.32,-.15);cube(g,'Tủ thờ',0,.65,0,1.65,1.1,.55,M.darkwood);cube(g,'Mặt bàn thờ',0,1.25,0,1.9,.12,.75,M.wood);cyl(g,0,1.55,-.08,.16,.16,.28,mat(0xb88a45));for(let x of [-.45,.45])cyl(g,x,1.5,0,.10,.10,.22,mat(0xb88a45));
g=item('Tủ quần áo',2.0,3.32,-4.5);cube(g,'Thân tủ',0,1.1,0,1.1,2.2,.65,M.wood);for(let x of [-.25,.25])cube(g,'Cánh tủ',x,1.1,.34,.53,2.08,.06,M.darkwood);cube(g,'Tay nắm tủ',0,1.1,.4,.035,.32,.04,M.metal);
g=item('Bàn học',-1.65,3.32,4.25);cube(g,'Mặt bàn học',0,.9,0,1.2,.10,.65,M.wood);for(let x of [-.5,.5])for(let z of [-.23,.23])cube(g,'Chân bàn học',x,.45,z,.06,.9,.06,M.darkwood);cube(g,'Màn hình máy tính',0,1.28,-.18,.65,.48,.08,M.black);
// character articulated family
const people=[];
function limb(parent,px,py,pz,len,r,material){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8),material);mesh.position.set(px,py,pz);mesh.castShadow=true;parent.add(mesh);return mesh;}
function person(name,x,y,z,kind,shirt){const root=new THREE.Group();root.position.set(x,y,z);house.add(root);root.userData={name,home:new THREE.Vector3(x,y,z),kind,rag:0,target:null,walking:false,drag:false,vel:new THREE.Vector3()};const skin=M.skin,clothes=mat(shirt),hair=kind==='female'||kind==='girl'?mat(0x33251f):mat(0x342820);
const torso=cube(root,'Thân',0,.98,0,kind==='boy'||kind==='girl'?.48:.55,.72,.3,clothes);
const head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),skin);head.position.set(0,1.58,0);head.castShadow=true;root.add(head);
const haircap=new THREE.Mesh(new THREE.SphereGeometry(.28,14,10,0,Math.PI*2,0,Math.PI*.55),hair);haircap.position.set(0,1.68,0);root.add(haircap);
for(let ex of [-.105,.105]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),M.black);eye.position.set(ex,1.61,.245);root.add(eye);}
if(kind==='female'){limb(root,-.28,1.18,0,.4,.07,hair);limb(root,.28,1.18,0,.4,.07,hair);}
if(kind==='girl'){for(let ex of [-.23,.23]){const pony=new THREE.Mesh(new THREE.SphereGeometry(.09,10,8),hair);pony.position.set(ex,1.62,-.02);root.add(pony);limb(root,ex,1.37,-.02,.25,.045,hair);}}
if(kind==='female'||kind==='girl'){const skirt=cube(root,'Váy',0,.62,0,.62,.4,.38,mat(kind==='girl'?0xe6a7b5:shirt));}
const arms=[],legs=[];
for(let side of [-1,1]){let arm=limb(root,side*.38,1.0,0,.55,.085,skin);arm.rotation.z=side*-.18;arms.push(arm);let leg=limb(root,side*.15,.28,0,.58,.10,mat(0x343941));legs.push(leg);cube(root,'Giày',side*.15,.05,.08,.24,.12,.36,M.black);}
const label=labelSprite(name);label.position.set(0,2.12,0);root.add(label);
root.userData.parts={arms,legs,torso};people.push(root);return root;}
person('David',-.75,.12,1.0,'male',0x54758b);person('Emma',.3,.12,.75,'female',0x8d687a);person('Tom',-.75,3.42,4.0,'boy',0x6d9b70);person('Lily',.35,3.42,4.0,'girl',0xd98e9c);
let selected=people[0];function select(p){selected=p;status.innerHTML='Đang chọn: <b>'+p.userData.name+'</b>'+(p.userData.rag>0?' · đang ngã':'');}
// physics bodies for movable items and characters
const phys=[];
function bodyFor(obj,mass=1,radius=.32){const b=new CANNON.Body({mass,material:new CANNON.Material({friction:.55,restitution:.35})});b.addShape(new CANNON.Sphere(radius));b.position.set(obj.position.x,obj.position.y+radius,obj.position.z);world.addBody(b);phys.push({obj,body:b});return b;}
people.forEach(p=>{p.userData.body=bodyFor(p,1,.28);p.userData.body.collisionResponse=false;});
const dynamic=[];furniture.forEach((g,i)=>{if(['Bàn kính phòng khách','Sofa phòng khách','Bàn ăn','Xe máy'].includes(g.name)){const b=bodyFor(g,g.name==='Xe máy'?8:4,.35);dynamic.push({obj:g,body:b,base:g.position.clone()});}});
const floorBody=new CANNON.Body({mass:0});floorBody.addShape(new CANNON.Box(new CANNON.Vec3(3,.1,6)));floorBody.position.set(0,-.12,0);world.addBody(floorBody);
// camera orbit
let theta=Math.PI/4,phi=.88,dist=19,target=new THREE.Vector3(0,2.5,0);function updateCamera(){phi=Math.max(.18,Math.min(1.48,phi));dist=Math.max(9,Math.min(29,dist));camera.position.set(target.x+dist*Math.sin(theta)*Math.cos(phi),target.y+dist*Math.sin(phi),target.z+dist*Math.cos(theta)*Math.cos(phi));camera.lookAt(target);}
updateCamera();
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=null,dragging=null,dragOffset=new THREE.Vector3(),lastMove=0,lastPoint=null,gesture=null,wasPinch=false;
function setPointer(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(pointer,camera);}
function hitPerson(){setPointer(down);const hits=ray.intersectObjects(people,true);for(const h of hits){let o=h.object;while(o&& !people.includes(o))o=o.parent;if(o)return o;}return null;}
function hitFurniture(){setPointer(down);const roots=furniture;const hits=ray.intersectObjects(roots,true);for(const h of hits){let o=h.object;while(o&& !roots.includes(o))o=o.parent;if(o)return o;}return null;}
function floorHit(e){setPointer(e);let best=null,bestD=Infinity;for(const y of [0,3.3]){const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-y);const p=new THREE.Vector3();if(ray.ray.intersectPlane(plane,p)&&p.x>=-2.6&&p.x<=2.6&&p.z>=-5.8&&p.z<=5.8){const d=ray.ray.origin.distanceTo(p);if(d<bestD){bestD=d;best=p.clone();}}}return best;}
function moveTo(p,point){let level=point.y>2.3?3.42:.12;let z=THREE.MathUtils.clamp(point.z,-5.4,5.4);let x=THREE.MathUtils.clamp(point.x,-2.35,2.35);p.userData.target=new THREE.Vector3(x,level,z);p.userData.rag=0;p.userData.walking=true;}
function onDown(e){e.preventDefault();if(e.pointerType==='mouse'&&e.button!==0)return;down={x:e.clientX,y:e.clientY,id:e.pointerId};lastPoint={x:e.clientX,y:e.clientY};lastMove=performance.now();renderer.domElement.setPointerCapture(e.pointerId);setPointer(e);const p=hitPerson();const f=hitFurniture();if(p){select(p);dragging={obj:p,kind:'person',start:{x:e.clientX,y:e.clientY},time:performance.now(),last:new THREE.Vector3(p.position.x,p.position.y,p.position.z)};p.userData.target=null;p.userData.drag=true;}else if(f){dragging={obj:f,kind:'item',start:{x:e.clientX,y:e.clientY},time:performance.now(),last:new THREE.Vector3(f.position.x,f.position.y,f.position.z)};}else{dragging=null;}}
function onMove(e){if(!down)return;const dx=e.clientX-lastPoint.x,dy=e.clientY-lastPoint.y;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(dragging&&moved>7){setPointer(e);const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-(dragging.kind==='person'?(dragging.obj.position.y):dragging.obj.position.y));const pt=new THREE.Vector3();ray.ray.intersectPlane(plane,pt);if(pt){const o=dragging.obj;o.position.x=THREE.MathUtils.clamp(pt.x,-2.45,2.45);o.position.z=THREE.MathUtils.clamp(pt.z,-5.6,5.6);if(dragging.kind==='person'){o.userData.body.position.set(o.position.x,o.position.y+.3,o.position.z);}else{const d=dynamic.find(x=>x.obj===o);if(d)d.body.position.set(o.position.x,o.position.y+.35,o.position.z);}}dragging.last.set(dx,0,dy);lastMove=performance.now();}else if(!dragging&&moved>3){theta-=dx*.008;phi+=dy*.006;updateCamera();}lastPoint={x:e.clientX,y:e.clientY};}
function onUp(e){if(!down)return;const elapsed=performance.now()-(dragging?.time||performance.now());const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);
if(dragging){const d=dragging;const fast=elapsed<550&&moved>35;if(d.kind==='person'){const p=d.obj;p.userData.drag=false;if(fast){p.userData.rag=2.8;p.userData.body.velocity.set((e.clientX-down.x)*.035,3,(e.clientY-down.y)*.035);}else if(moved<12){p.userData.rag=0;}}else{const item=dynamic.find(x=>x.obj===d.obj);if(item){if(fast){item.body.velocity.set((e.clientX-down.x)*.045,4,(e.clientY-down.y)*.045);}else if(moved<12){item.body.velocity.y=3.8;}}}}
else if(moved<12){setPointer(e);const p=hitPerson();if(p){select(p);}else{const pt=floorHit(e);if(pt){if(selected){moveTo(selected,pt);}}else{const f=hitFurniture();if(f){const d=dynamic.find(x=>x.obj===f);if(d)d.body.velocity.y=3.5;}}}}
down=null;dragging=null;}
renderer.domElement.addEventListener('pointerdown',onDown);renderer.domElement.addEventListener('pointermove',onMove);renderer.domElement.addEventListener('pointerup',onUp);renderer.domElement.addEventListener('pointercancel',onUp);
// pinch zoom using touch events
let pinch0=0;renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);wasPinch=true;down=null;dragging=null;}},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch0){const n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);dist*=pinch0/n;pinch0=n;updateCamera();}},{passive:true});
renderer.domElement.addEventListener('touchend',()=>{pinch0=0;wasPinch=false;},{passive:true});
// autonomous wandering and stairs
let wanderTimer=0;function wander(){people.forEach(p=>{if(p.userData.rag<=0&&!p.userData.target&&!p.userData.drag){const upstairs=p.position.y>2;let nextUp=Math.random()<.35;let y=nextUp?(upstairs?.12:3.42):(upstairs?3.42:.12);let z=THREE.MathUtils.randFloat(-4.7,4.7);let x=THREE.MathUtils.randFloat(-2.1,2.1);p.userData.target=new THREE.Vector3(x,y,z);p.userData.walking=true;}});}
function animatePeople(dt){people.forEach(p=>{const u=p.userData;if(u.drag)return;if(u.rag>0){u.rag-=dt;u.parts.legs.forEach((l,i)=>l.rotation.z=Math.sin(performance.now()*.01+i)*.8);if(u.rag<=0){u.body.velocity.set(0,0,0);u.target=null;}return;}if(u.target){const dx=u.target.x-p.position.x,dz=u.target.z-p.position.z,dy=u.target.y-p.position.y;const d=Math.hypot(dx,dz);if(d>.18){const speed=.95;const step=Math.min(d,speed*dt);p.position.x+=dx/d*step;p.position.z+=dz/d*step;p.rotation.y=Math.atan2(dx,dz);u.parts.legs.forEach((l,i)=>l.rotation.x=Math.sin(performance.now()*.012+i*Math.PI)*.48);u.parts.arms.forEach((a,i)=>a.rotation.z=(i?1:-1)*(.18+Math.sin(performance.now()*.012+i)*.25));if(Math.abs(dy)>.1){p.position.y+=Math.sign(dy)*Math.min(Math.abs(dy),1.4*dt);}}else{p.position.x=u.target.x;p.position.z=u.target.z;p.position.y=u.target.y;u.target=null;u.walking=false;}}else{u.parts.legs.forEach(l=>l.rotation.x*=.85);u.parts.arms.forEach(a=>a.rotation.z*=.85);}u.body.position.set(p.position.x,p.position.y+.3,p.position.z);});}
let low=false,roofOn=true;
document.getElementById('roof').onclick=()=>{roofOn=!roofOn;roof.visible=roofOn;const b=document.getElementById('roof');b.textContent='⌂ Mái nhà: '+(roofOn?'Bật':'Tắt');b.classList.toggle('active',roofOn);};
document.getElementById('gravity').onclick=()=>{low=!low;world.gravity.set(0,low?-2.2:-9.82,0);const b=document.getElementById('gravity');b.textContent='↓ Trọng lực thấp: '+(low?'Bật':'Tắt');b.classList.toggle('active',low);};
function reset(){roofOn=true;roof.visible=true;low=false;world.gravity.set(0,-9.82,0);document.getElementById('roof').textContent='⌂ Mái nhà: Bật';document.getElementById('roof').classList.add('active');document.getElementById('gravity').textContent='↓ Trọng lực thấp: Tắt';document.getElementById('gravity').classList.remove('active');theta=Math.PI/4;phi=.88;dist=19;target.set(0,2.5,0);updateCamera();people.forEach(p=>{const u=p.userData;p.position.copy(u.home);u.target=null;u.rag=0;u.drag=false;u.body.position.set(p.position.x,p.position.y+.3,p.position.z);u.body.velocity.set(0,0,0);});dynamic.forEach(d=>{d.obj.position.copy(d.base);d.body.position.set(d.base.x,d.base.y+.35,d.base.z);d.body.velocity.set(0,0,0);d.body.angularVelocity.set(0,0,0);});select(people[0]);}
document.getElementById('reset').onclick=reset;
// collisions can knock family into ragdoll; fragile objects shatter on strong impact
const breakables=['Màn hình TV','Mặt kính','Màn hình máy tính','Bình hoa','Cốc','Đèn'];let shards=[];
function shatter(obj){if(obj.userData.broken)return;obj.userData.broken=true;const parent=obj.parent;const pos=obj.getWorldPosition(new THREE.Vector3());parent.remove(obj);for(let i=0;i<7;i++){const s=cube(scene,'Mảnh vỡ',pos.x+(Math.random()-.5)*.35,pos.y+(Math.random()-.5)*.25,pos.z+(Math.random()-.5)*.35,.08+Math.random()*.12,.05+Math.random()*.12,.08,mat(0x9ccbd2,.2,.1,true,.8));shards.push({mesh:s,life:4,vel:new THREE.Vector3((Math.random()-.5)*2,Math.random()*3,(Math.random()-.5)*2)});}}
let previous=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-previous)/1000,.033);previous=now;wanderTimer+=dt;if(wanderTimer>8){wanderTimer=0;wander();}
world.step(1/60,dt,3);dynamic.forEach(d=>{d.obj.position.set(d.body.position.x,d.body.position.y-.35,d.body.position.z);d.obj.quaternion.set(d.body.quaternion.x,d.body.quaternion.y,d.body.quaternion.z,d.body.quaternion.w);});
animatePeople(dt);
shards=shards.filter(s=>{s.life-=dt;s.vel.y-=9.8*dt;s.mesh.position.addScaledVector(s.vel,dt);s.mesh.rotation.x+=dt*3;s.mesh.rotation.z+=dt*2;if(s.life<=0){scene.remove(s.mesh);return false;}return true;});
renderer.render(scene,camera);}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
loading.style.display='none';
})();
</script>
